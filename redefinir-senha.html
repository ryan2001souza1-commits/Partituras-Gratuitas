<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | TechStore</title>
    <meta name="description" content="Defina sua nova senha na TechStore">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <a href="index.html" class="auth-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19 5 12 12 5"/></svg>
            Voltar à loja
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo auth-logo">Tech<span>Store</span></a>
                <h1 class="auth-title">Redefinir senha</h1>
                <p class="auth-subtitle">Crie uma nova senha de no mínimo 8 caracteres</p>
            </div>

            <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

            <form id="redefinir-form" class="auth-form" novalidate>
                <div class="field">
                    <label for="nova-senha" class="field-label">Nova senha</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="nova-senha" name="nova-senha" class="input" placeholder="Nova senha" autocomplete="new-password" required>
                        <button type="button" class="toggle-pass" data-target="nova-senha" aria-label="Mostrar senha">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94"/><path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.47-5.47"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="erro-nova"></span>
                </div>

                <div class="field">
                    <label for="confirmar-nova" class="field-label">Confirmar nova senha</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="confirmar-nova" name="confirmar-nova" class="input" placeholder="Repita a nova senha" autocomplete="new-password" required>
                        <button type="button" class="toggle-pass" data-target="confirmar-nova" aria-label="Mostrar senha">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94"/><path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.47-5.47"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="erro-confirmar-nova"></span>
                </div>

                <div id="token-info" class="token-info"></div>

                <button type="submit" class="btn btn--primary auth-btn" id="btn-redefinir">
                    <span class="btn-text">Redefinir senha</span>
                    <svg class="btn-loader" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                </button>
            </form>

            <p class="auth-footer"><a href="login.html">← Voltar ao login</a> · <a href="esqueci-senha.html">Solicitar novo link</a></p>
        </div>

        <p class="auth-secure-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Simulação front-end — token com expiração de 15 min, invalidado após uso.
        </p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
