<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto | TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" id="header">
        <div class="container header__content">
            <a href="index.html" class="logo">Tech<span>Store</span></a>
            <nav class="nav" id="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Início</a></li>
                    <li><a href="produtos.html" class="nav__link">Produtos</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <div class="search">
                    <input type="search" id="search-input" class="search__input" placeholder="Buscar produto..." aria-label="Buscar produto" autocomplete="off">
                    <button class="search__btn" id="search-btn" aria-label="Buscar">&#128269;</button>
                </div>
                <div id="auth-area" class="auth-area" aria-live="polite">
                    <a href="login.html" class="auth-link">Entrar</a>
                    <a href="cadastro.html" class="btn btn--primary btn--sm" style="padding:8px 14px; font-size:.85rem; border-radius:999px">Criar conta</a>
                </div>
                <button class="icon-btn" id="dark-mode-btn" aria-label="Alternar tema">&#9790;</button>
                <a href="carrinho.html" class="cart-icon" aria-label="Carrinho">&#128722;<span class="cart-count" id="cart-count">0</span></a>
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="container section">
        <a href="produtos.html" class="produto__voltar">← Voltar para produtos</a>
        <div id="produto-detalhe"></div>
    </main>

    <footer class="footer">
        <div class="footer__content container">
            <div class="footer__col">
                <a href="index.html" class="logo logo--footer">Tech<span>Store</span></a>
                <p>Tudo em tecnologia com os melhores preços.</p>
            </div>
            <div class="footer__col">
                <h4>Ajuda</h4>
                <ul><li><a href="#">Frete</a></li><li><a href="#">Trocas</a></li></ul>
            </div>
            <div class="footer__col">
                <h4>Contato</h4>
                <p>contato@techstore.com.br</p>
            </div>
        </div>
        <div class="footer__bottom"><div class="container"><p>&copy; 2026 TechStore</p></div></div>
    </footer>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="js/produtos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
