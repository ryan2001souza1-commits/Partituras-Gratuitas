<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | TechStore</title>
    <meta name="description" content="Acesse sua conta na TechStore">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <a href="index.html" class="auth-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19 5 12 12 5"/></svg>
            Voltar à loja
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo auth-logo">Tech<span>Store</span></a>
                <h1 class="auth-title">Bem-vindo de volta</h1>
                <p class="auth-subtitle">Entre com seu e-mail e senha</p>
            </div>

            <div id="auth-feedback" class="auth-feedback" role="alert" aria-live="polite"></div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="field">
                    <label for="email" class="field-label">E-mail</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="email" name="email" class="input" placeholder="voce@exemplo.com" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="erro-email"></span>
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="senha" class="field-label">Senha</label>
                        <a href="esqueci-senha.html" class="forgot-link">Esqueci minha senha</a>
                    </div>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="senha" name="senha" class="input" placeholder="Sua senha" autocomplete="current-password" required>
                        <button type="button" class="toggle-pass" data-target="senha" aria-label="Mostrar senha">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94"/><path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.47-5.47"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="erro-senha"></span>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="lembrar">
                    <span class="checkbox-box" aria-hidden="true"></span>
                    <span class="checkbox-label">Lembrar de mim</span>
                </label>

                <button type="submit" class="btn btn--primary auth-btn" id="btn-login">
                    <span class="btn-text">Entrar</span>
                    <svg class="btn-loader" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                </button>
            </form>

            <p class="auth-footer">Não tem conta? <a href="cadastro.html">Criar uma conta</a></p>
        </div>

        <p class="auth-secure-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Demonstração front-end — autenticação via localStorage, sem backend real.
        </p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
