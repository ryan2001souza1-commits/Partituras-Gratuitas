<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Admin TechStore</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="../js/auth.js"></script>
    <script>if(typeof isAdmin==='function' && !isAdmin()) window.location.replace('../login.html');</script>
</head>
<body class="admin">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-sidebar__header">
                <a href="index.html" class="admin-logo">Tech<span>Store</span></a>
                <span class="admin-badge">Admin</span>
            </div>
            <nav class="admin-nav">
                <div class="admin-nav__label">Principal</div>
                <a href="index.html" class="admin-nav__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
                <a href="produtos.html" class="admin-nav__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Produtos</a>
                <a href="pedidos.html" class="admin-nav__link active" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 21h-8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z"/><polyline points="8 11 12 15 16 11"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Pedidos</a>
                <a href="configuracoes.html" class="admin-nav__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 15a1.65 1.65 0 0 0-1-1.51H8a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1-1.51 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 13.4 3.4a1.65 1.65 0 0 0 1 1.51V5a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1 1.51H20a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1 1.51z"/></svg>Configurações</a>
                <div class="admin-nav__label">Loja</div>
                <a href="../index.html" class="admin-nav__link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Ver loja</a>
                <a href="#" class="admin-nav__link" id="admin-logout-mobile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sair</a>
            </nav>
            <div class="admin-sidebar__footer">
                <div class="admin-user">
                    <div class="admin-user__avatar">A</div>
                    <div class="admin-user__info">
                        <div class="admin-user__name" id="admin-user-nome">Administrador</div>
                        <div class="admin-user__email" id="admin-user-email">admin@techstore.com</div>
                    </div>
                </div>
                <button type="button" class="btn btn--primary" id="admin-logout" style="width:100%; justify-content:center; border-radius:10px; padding:10px">Sair do painel</button>
            </div>
        </aside>
        <div class="admin-overlay" id="admin-overlay"></div>
        <div class="admin-main">
            <header class="admin-topbar">
                <div>
                    <h1 class="admin-topbar__title">Pedidos</h1>
                    <p class="admin-topbar__subtitle"><span id="pedidos-count">0</span> pedidos • <span id="pedidos-valor"></span></p>
                </div>
                <button class="admin-menu-btn" id="admin-menu-btn" aria-label="Abrir menu"><span></span><span></span><span></span></button>
            </header>
            <main class="admin-content">
                <div class="admin-toolbar">
                    <div class="admin-toolbar__search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="search" id="pedidos-busca" placeholder="Buscar por cliente ou #...">
                    </div>
                    <select id="pedidos-filtro-status" style="padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); font-size:.88rem">
                        <option value="">Todos os status</option>
                        <option>Aguardando pagamento</option>
                        <option>Pago</option>
                        <option>Em preparação</option>
                        <option>Enviado</option>
                        <option>Entregue</option>
                        <option>Cancelado</option>
                    </select>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th># Pedido</th>
                                <th>Cliente</th>
                                <th>Data</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th style="width:180px">Alterar status</th>
                            </tr>
                        </thead>
                        <tbody id="pedidos-tbody">
                            <tr><td colspan="6" style="text-align:center; padding:24px; color:var(--text-muted)">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                <p style="font-size:.82rem; color:var(--text-muted); margin-top:10px">Pedidos fictícios para demonstração. Alterações salvas em <code>localStorage</code>.</p>
            </main>
        </div>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="../js/produtos.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
